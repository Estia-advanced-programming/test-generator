      result: "MISSING_COLNAMES - ./Generated/amissing_colnames.frd ./Generated/missing_colnames.frd"
    - file: testsFiles/ordering.frd
      result: "ORDERING - ./Generated/ordering.frd"
    - file: testsFiles/ordering.frd testsFiles/aordering.frd
