desc: error1
mode: full
features:
  ERROR: 
    - file: testsFiles/base.frd
      option: "-o boop"
      result: "Invalid Option -o boop (or --output boop) is not recognized"
    - file: testsFiles/errors/base.frd
      option: "-o "
      result: "Invalid Option -o (or --output) is missing a parameter"
    - file: testsFiles/errors/base.frd
      metadata: "boop"
      result: "Invalid Option -m boop (or --metadata boop) is not a valid metadata"
    - file: a.frd
      result: "MISSING_FILE - a.frd"
    - file: c.frd a.frd b.frd
      result: "MISSING_FILE - a.frd b.frd c.frd"
    - file: testsFiles/encoding.frd
      result: "ENCODING - ./Generated/encoding.frd"
    - file: testsFiles/encoding.frd testsFiles/decoding.frd
      result: "ENCODING - ./Generated/decoding.frd ./Generated/encoding.frd"
    - file: testsFiles/corrupted.frd
      result: "CORRUPTED - ./Generated/corrupted.frd"
    - file: testsFiles/decorrupted.frd testsFiles/corrupted.frd
      result: "CORRUPTED - ./Generated/corrupted.frd ./Generated/decorrupted.frd"
    - file: testsFiles/missing_header.frd
      result: "MISSING_HEADER - ./Generated/missing_header.frd"
