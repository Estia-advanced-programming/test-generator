      result: "INCOMPLETE_HEADER - ./Generated/incomplete_header.frd=[origin] ./Generated/incomplete_header2.frd=[to] ./Generated/incomplete_header3.frd=[flight id, from, motor(s)] ./Generated/incomplete_header4.frd=[origin, to, flight id, from, motor(s)]"
    - file: testsFiles/missing_column1.frd
      result: "MISSING_COLUMN - ./Generated/missing_column1.frd=[longitude]"
